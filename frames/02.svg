<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="pi-headless-subagent demo frame 2">
  <defs>
    <linearGradient id="frameAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="#0d0d12"/>

  <!-- label chip -->
  <rect x="48" y="40" rx="8" width="360" height="52" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed"/>
  <text x="228" y="76" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="28" fill="#c4b5fd">2/4 · isolated processes</text>

  <!-- terminal window -->
  <rect x="48" y="128" rx="16" width="1184" height="624" fill="#101017" stroke="#26262f" stroke-width="2"/>
  <rect x="48" y="128" rx="16" width="1184" height="64" fill="#16161d"/>
  <circle cx="92" cy="160" r="10" fill="#ff5f57"/>
  <circle cx="124" cy="160" r="10" fill="#febc2e"/>
  <circle cx="156" cy="160" r="10" fill="#28c840"/>
  <text x="640" y="170" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#8b8b9e">ps — 3 child processes</text>

  <!-- code lines -->
  <text x="96" y="264" font-family="ui-monospace, Menlo, monospace" font-size="34" fill="#e6e6ef">
    <tspan x="96" dy="0">$ pi --mode rpc   # a1b2  repo-a</tspan>
    <tspan x="96" dy="1.4em" fill="#7c3aed">$ pi --mode rpc   # c3d4  repo-b</tspan>
    <tspan x="96" dy="1.4em" fill="#7c3aed">$ pi --mode rpc   # e5f6  repo-c</tspan>
    <tspan x="96" dy="1.4em">  session-isolated: own context, own history</tspan>
    <tspan x="96" dy="1.4em">  loads the same extensions as the parent</tspan>
    <tspan x="96" dy="1.4em" fill="#8b8b9e">  each child gets update_status(message) tool</tspan>
  </text>
</svg>
