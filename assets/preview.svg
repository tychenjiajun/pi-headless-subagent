<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="pi-headless-subagent promo card">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#7c3aed" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0v50" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#0d0d12"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- corner labels -->
  <rect x="140" y="120" rx="8" width="300" height="56" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed"/>
  <text x="290" y="158" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="30" fill="#c4b5fd">pi-extension</text>
  <text x="1460" y="158" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="30" fill="#8b8b9e">pi.dev/packages</text>

  <!-- name -->
  <text x="800" y="470" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="96" font-weight="700" fill="#ffffff">pi-headless-subagent</text>

  <!-- tagline -->
  <text x="800" y="570" text-anchor="middle" font-family="system-ui, sans-serif" font-size="44" fill="#c9c9d4">Isolated parallel subagents for pi</text>

  <!-- install pill -->
  <rect x="300" y="660" rx="14" width="1000" height="96" fill="#16161d" stroke="url(#accent)" stroke-width="3"/>
  <text x="800" y="722" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="42" fill="#a78bfa">$ pi install npm:pi-headless-subagent</text>

  <!-- accent bar -->
  <rect x="440" y="852" width="720" height="10" rx="5" fill="url(#accent)"/>
</svg>
